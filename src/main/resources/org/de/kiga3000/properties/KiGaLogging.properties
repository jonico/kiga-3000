############################################################
#  	Logging Configuration File
#
# To use this file specify its filename
# with the java.util.logging.config.file system property. 
#
# 
#
############################################################

############################################################
#  	Global properties
############################################################

# "handlers" specifies a comma separated list of log Handler 
# classes.  These handlers will be installed during VM startup.
# Note that these classes must be on the system classpath.

# Add a FileHandler
handlers=java.util.logging.FileHandler
#handlers=java.util.logging.FileAppender
# Default global logging level.
# This specifies which kinds of events are logged across
# all loggers.  For any given facility this global level
# can be overridden by a facility specific level
.level = INFO

############################################################
# Handler specific properties.
# Describes specific configuration info for Handlers.
############################################################

# Log file location.
#
# Was "logs/KiGa3000Log%u.xml", which is relative to the process working directory.
# The comment above claimed the output goes to the user's home directory, but a
# relative pattern does not do that - it wrote into whatever directory the
# application happened to be started from, and FileHandler failed outright when no
# "logs" subdirectory existed there. %h is the placeholder that actually means the
# user's home directory, so the comment is now true. KigaMainControl creates the
# directory before applying this configuration, because FileHandler does not create
# parent directories.
java.util.logging.FileHandler.pattern = %h/.kiga3000/logs/KiGa3000Log%u.xml
#
# Was "formatter.LoggingFormatter". No such class exists - not in this project and
# not anywhere in the original 2004-2006 CVS repository - so java.util.logging threw
# ClassNotFoundException while reading this file and silently discarded the whole
# configuration. The log pattern is *.xml, so the JDK's own XMLFormatter is evidently
# what was intended.
java.util.logging.FileHandler.formatter = java.util.logging.XMLFormatter
java.util.logging.FileHandler.append = true

############################################################
# Facility specific properties.
# Provides extra control for each logger.
############################################################

# messages:

#au.com.forward.ExampleLoggingApplication.level = FINEST
testlogger.Main.level = INFO
