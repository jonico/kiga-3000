$kind: http-request
description: |-
  The API is read-only, and says so with 405 plus an Allow header rather than a 404.

  Sent against an id that exists, so a 405 here cannot be mistaken for the resource
  being absent.
url: "{{base_url}}/api/cards/1"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 405", () => pm.response.to.have.status(405));

      pm.test("Allow header advertises GET only", () =>
        pm.expect(pm.response.headers.get("Allow")).to.eql("GET"));

      pm.test("Error body has the uniform shape", () => {
        const body = pm.response.json();
        pm.expect(Object.keys(body).sort()).to.eql(["error", "status"]);
        pm.expect(body.status).to.eql(405);
        pm.expect(body.error.toLowerCase()).to.include("read-only");
      });
    language: text/javascript
order: 6000
