$kind: http-request
description: |-
  Unknown fields are refused, never dropped.

  A caller who sends `religion` must be told it is not writable, because the
  alternative is that they believe it was stored. The error names the field.
url: "{{base_url}}/api/cards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "gruppe": 1,
      "vorname": "Test",
      "nachname": "Probe",
      "religion": "none"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));

      pm.test("Error body has the uniform shape", () => {
        const body = pm.response.json();
        pm.expect(Object.keys(body).sort()).to.eql(["error", "status"]);
        pm.expect(body.status).to.eql(pm.response.code);
      });

      pm.test("Error names the offending field", () =>
        pm.expect(pm.response.json().error).to.include("religion"));
    language: text/javascript
order: 7800
