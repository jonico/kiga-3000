$kind: http-request
description: |-
  vorname is required. A card without a first name is not stored.
url: "{{base_url}}/api/cards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "gruppe": 1,
      "nachname": "Probe"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));

      pm.test("Error body has the uniform shape", () => {
        const body = pm.response.json();
        pm.expect(Object.keys(body).sort()).to.eql(["error", "status"]);
        pm.expect(body.status).to.eql(pm.response.code);
      });

      pm.test("Error mentions vorname", () =>
        pm.expect(pm.response.json().error).to.include("vorname"));
    language: text/javascript
order: 8200
