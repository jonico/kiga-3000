$kind: http-request
description: |-
  31 February is not a date. The API validates rather than passing it through,
  because storing an unparseable date would silently become no date at all.
url: "{{base_url}}/api/cards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "gruppe": 1,
      "vorname": "Test",
      "nachname": "Probe",
      "geburtsdatum": "31.02.2019"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));

      pm.test("Error body has the uniform shape", () => {
        const body = pm.response.json();
        pm.expect(Object.keys(body).sort()).to.eql(["error", "status"]);
        pm.expect(body.status).to.eql(pm.response.code);
      });

      pm.test("Error mentions geburtsdatum", () =>
        pm.expect(pm.response.json().error).to.include("geburtsdatum"));
    language: text/javascript
order: 8100
