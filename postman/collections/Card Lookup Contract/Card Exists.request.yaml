$kind: http-request
description: |-
  Existence: id 1 is always present once db/seed.sql has been applied.

  The key-set assertion is the interesting one. CardSummary exposes six fields out of
  the table's 39, withholding religion, nationality, vaccination history, illnesses,
  doctor, insurer and free-text health notes - special-category data under GDPR
  Article 9. Asserting the exact key set means any widening of the projection fails
  here rather than shipping quietly.
url: "{{base_url}}/api/cards/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Content-Type is JSON, UTF-8", () =>
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));

      const card = pm.response.json();

      pm.test("Exposes exactly the six CardSummary fields, nothing more", () =>
        pm.expect(Object.keys(card).sort()).to.eql(
          ["eintritt", "geburtsdatum", "gruppe", "id", "nachname", "vorname"]));

      pm.test("id echoes the requested id, as a number", () => {
        pm.expect(card.id).to.be.a("number");
        pm.expect(card.id).to.eql(1);
      });

      pm.test("gruppe is a byte-range integer", () => {
        pm.expect(card.gruppe).to.be.a("number");
        pm.expect(card.gruppe % 1).to.eql(0);
        pm.expect(card.gruppe).to.be.within(0, 255);
      });

      pm.test("Names are non-empty strings", () => {
        pm.expect(card.vorname).to.be.a("string").and.not.empty;
        pm.expect(card.nachname).to.be.a("string").and.not.empty;
      });

      pm.test("Dates are German dd.MM.yyyy, not ISO", () => {
        pm.expect(card.geburtsdatum).to.match(/^\d{2}\.\d{2}\.\d{4}$/);
        pm.expect(card.eintritt).to.match(/^\d{2}\.\d{2}\.\d{4}$/);
      });
    language: text/javascript
order: 1000
