$kind: http-request
description: |-
  Write path, step 5 of 6: delete the card, which also cleans up after the suite.

  204 means success with no body at all, so the body is asserted empty.
url: "{{base_url}}/api/cards/{{created_id}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 204", () => pm.response.to.have.status(204));
      pm.test("No body", () => pm.expect(pm.response.text()).to.eql(""));
    language: text/javascript
order: 7400
