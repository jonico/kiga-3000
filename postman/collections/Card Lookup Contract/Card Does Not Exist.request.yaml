$kind: http-request
description: |-
  Non-existence: a syntactically valid id with no row behind it.

  99999 is far beyond the seeded range. Distinct from the malformed-id case below: this
  is a well-formed request for something absent, so 404 is the answer, not 400.
url: "{{base_url}}/api/cards/99999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));

      const body = pm.response.json();

      pm.test("Error body has the uniform shape", () => {
        pm.expect(Object.keys(body).sort()).to.eql(["error", "status"]);
        pm.expect(body.status).to.eql(404);
        pm.expect(body.error).to.be.a("string").and.not.empty;
      });

      pm.test("Message names the missing id", () =>
        pm.expect(body.error).to.include("99999"));

      pm.test("No card fields leak into an error response", () => {
        pm.expect(body).to.not.have.property("vorname");
        pm.expect(body).to.not.have.property("nachname");
      });
    language: text/javascript
order: 3000
