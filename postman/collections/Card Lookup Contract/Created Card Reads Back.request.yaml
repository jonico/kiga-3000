$kind: http-request
description: |-
  Write path, step 2 of 6: the card created above is there, and says what was sent.

  A 201 only proves the server accepted the request. This proves it was stored.
url: "{{base_url}}/api/cards/{{created_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const card = pm.response.json();
      pm.test("Same card as created", () => {
        pm.expect(String(card.id)).to.eql(pm.collectionVariables.get("created_id"));
        pm.expect(card.vorname).to.eql("Jörg");
        pm.expect(card.nachname).to.eql("Müller-Lüdenscheidt");
        pm.expect(card.gruppe).to.eql(3);
        pm.expect(card.geburtsdatum).to.eql("05.03.2019");
      });
    language: text/javascript
order: 7100
