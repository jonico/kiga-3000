$kind: http-request
description: |-
  Groups run 1 to 9, where 9 is the data-retention group. 10 is out.
url: "{{base_url}}/api/cards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "gruppe": 10,
      "vorname": "Test",
      "nachname": "Probe"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));

      pm.test("Error body has the uniform shape", () => {
        const body = pm.response.json();
        pm.expect(Object.keys(body).sort()).to.eql(["error", "status"]);
        pm.expect(body.status).to.eql(pm.response.code);
      });

      pm.test("Error mentions gruppe", () =>
        pm.expect(pm.response.json().error).to.include("gruppe"));
    language: text/javascript
order: 8000
