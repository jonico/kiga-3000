$kind: http-request
description: |-
  The canned card, with the scenario header.

  The key-set assertion is the one worth having: it fails if the published mock ever
  starts exposing fields beyond the six in CardSummary, which is the projection that
  keeps the 33 withheld columns - religion, health notes, vaccinations, doctor, insurer
  - out of an unauthenticated response.
url: "{{base_url}}/api/cards/1"
method: GET
headers:
  - key: x-mock-scenario
    value: default
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Content-Type is JSON", () =>
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));

      const card = pm.response.json();

      pm.test("Exposes exactly the six CardSummary fields, nothing more", () =>
        pm.expect(Object.keys(card).sort()).to.eql(
          ["eintritt", "geburtsdatum", "gruppe", "id", "nachname", "vorname"]));

      pm.test("id and gruppe are integers", () => {
        pm.expect(card.id).to.be.a("number");
        pm.expect(card.gruppe).to.be.a("number");
        pm.expect(card.gruppe).to.be.within(0, 255);
      });

      pm.test("Names are non-empty strings", () => {
        pm.expect(card.vorname).to.be.a("string").and.not.empty;
        pm.expect(card.nachname).to.be.a("string").and.not.empty;
      });

      pm.test("Dates are German dd.MM.yyyy", () => {
        pm.expect(card.geburtsdatum).to.match(/^\d{2}\.\d{2}\.\d{4}$/);
        pm.expect(card.eintritt).to.match(/^\d{2}\.\d{2}\.\d{4}$/);
      });

      pm.test("Response carries no real-person data from the private fixture", () => {
        const body = pm.response.text();
        ["Nicolai", "Däubler", "Seyther"].forEach((n) =>
          pm.expect(body, `published mock leaked "${n}"`).to.not.include(n));
      });
    language: text/javascript
order: 1000
