$kind: http-request
description: |-
  Liveness, and deliberately the first request so a cold deployment warms up here
  rather than mid-suite.

  A freshly deployed mock can refuse the first connection outright; that was mistaken
  for an unreachable host once already. Sent without the scenario header on purpose:
  health needs no dataset, so it must answer either way, and if this passes while the
  header-carrying requests fail then scenario selection is the problem rather than the
  deployment.
url: "{{base_url}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Fixed liveness payload", () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql("ok");
        pm.expect(body.service).to.eql("kiga3000");
        pm.expect(body.api).to.eql("read-only");
      });
    language: text/javascript
order: 500
