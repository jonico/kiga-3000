$kind: http-request
description: |
  Example request for /api/cards/{id}.
  The id must be numeric; unknown ids return 404.
url: http://127.0.0.1:8080/api/cards/2
method: GET
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      const template = `
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: var(--spacing-l); color: var(--content-color-primary);">
        <h1 style="color: var(--content-color-primary); margin-bottom: var(--spacing-l);">Card Details</h1>
        <div style="background: var(--background-color-secondary); padding: var(--spacing-l); border-radius: 8px;">
          <div style="margin-bottom: var(--spacing-m);"><strong>ID:</strong> {{id}}</div>
          <div style="margin-bottom: var(--spacing-m);"><strong>Name:</strong> {{vorname}} {{nachname}}</div>
          <div style="margin-bottom: var(--spacing-m);"><strong>Group:</strong> {{gruppe}}</div>
          <div style="margin-bottom: var(--spacing-m);"><strong>Birth Date:</strong> {{geburtsdatum}}</div>
          <div style="margin-bottom: var(--spacing-m);"><strong>Gender:</strong> {{geschlecht}}</div>
          {{#if notizen}}
          <div style="margin-bottom: var(--spacing-m);"><strong>Notes:</strong> {{notizen}}</div>
          {{/if}}
        </div>
      </div>
      `;

      pm.visualizer.set(template, response);
    language: text/javascript
order: 3000
