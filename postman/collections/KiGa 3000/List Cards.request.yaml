$kind: http-request
description: |
  Returns every card summary in repository order.
  The summary intentionally omits sensitive fields such as religion, health notes,
  vaccinations, illnesses, doctor and insurer data.
url: "{{base_url}}/api/cards"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      const template = `
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: var(--spacing-l); color: var(--content-color-primary);">
        <h1 style="color: var(--content-color-primary); margin-bottom: var(--spacing-l);">Card Summaries</h1>
        <p style="margin-bottom: var(--spacing-l);">Total cards: {{length}}</p>
        <table style="width: 100%; border-collapse: collapse; background: var(--background-color-secondary); border-radius: 8px; overflow: hidden;">
          <thead>
            <tr style="background: var(--background-color-tertiary);">
              <th style="padding: var(--spacing-m); text-align: left; border-bottom: 1px solid var(--border-color-default);">ID</th>
              <th style="padding: var(--spacing-m); text-align: left; border-bottom: 1px solid var(--border-color-default);">First Name</th>
              <th style="padding: var(--spacing-m); text-align: left; border-bottom: 1px solid var(--border-color-default);">Last Name</th>
              <th style="padding: var(--spacing-m); text-align: left; border-bottom: 1px solid var(--border-color-default);">Group</th>
              <th style="padding: var(--spacing-m); text-align: left; border-bottom: 1px solid var(--border-color-default);">Birth Date</th>
            </tr>
          </thead>
          <tbody>
            {{#each this}}
            <tr>
              <td style="padding: var(--spacing-m); border-bottom: 1px solid var(--border-color-default);">{{id}}</td>
              <td style="padding: var(--spacing-m); border-bottom: 1px solid var(--border-color-default);">{{vorname}}</td>
              <td style="padding: var(--spacing-m); border-bottom: 1px solid var(--border-color-default);">{{nachname}}</td>
              <td style="padding: var(--spacing-m); border-bottom: 1px solid var(--border-color-default);">{{gruppe}}</td>
              <td style="padding: var(--spacing-m); border-bottom: 1px solid var(--border-color-default);">{{geburtsdatum}}</td>
            </tr>
            {{/each}}
          </tbody>
        </table>
      </div>
      `;

      pm.visualizer.set(template, {
        length: response.length,
        ...response
      });
    language: text/javascript
order: 2000
