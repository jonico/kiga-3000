$kind: http-request
description: 'Returns 200 with {"status":"ok"}. Response content type: application/json; charset=utf-8.'
url: "{{base_url}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      // Prepare data with computed emoji
      const data = {
        status: response.status,
        service: response.service || '',
        api: response.api || '',
        emoji: response.status === 'ok' ? '✅' : '❌'
      };

      const template = `
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: var(--spacing-l); color: var(--content-color-primary);">
        <h1 style="color: var(--content-color-primary); margin-bottom: var(--spacing-l);">Health Check</h1>
        <div style="background: var(--background-color-secondary); padding: var(--spacing-l); border-radius: 8px; text-align: center;">
          <div style="font-size: 48px; margin-bottom: var(--spacing-m);">
            {{emoji}}
          </div>
          <div style="font-size: 24px; font-weight: bold; margin-bottom: var(--spacing-m);">
            Status: {{status}}
          </div>
          {{#if service}}
          <div style="font-size: 14px; opacity: 0.8;">
            Service: {{service}} | API: {{api}}
          </div>
          {{/if}}
        </div>
      </div>
      `;

      pm.visualizer.set(template, data);
    language: text/javascript
order: 1000
