$kind: mcp-request
description: |-
  Get all available Stream Deck actions from all installed plugins.

  This returns the complete catalog of actions that can be used with Stream Deck,
  including both AI-ready and non-AI-ready actions.

  **Use Cases:**
  - Discover available plugins and their actions
  - Find action IDs for configuration
  - Browse all Stream Deck capabilities

  **Response includes:**
  - Action IDs
  - Plugin information
  - Action names and descriptions
  - AI-ready status
