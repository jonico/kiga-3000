$kind: collection
description: |-
  Comprehensive collection for interacting with the Stream Deck MCP server.

  This collection provides MCP requests to control Stream Deck actions, check bridge status, and execute configured buttons.

  **Available Actions:**
  - Bridge Status: Check Stream Deck connection
  - List Actions: Get all available Stream Deck actions
  - Execute Actions: Trigger configured Stream Deck buttons
  - AI Request: Use AI to automatically find and execute actions

  **Variables:**
  - sleep_action_id: ID for the Mac sleep button
  - text_action_id: ID for the DB/REST Test text button
  - mcp_server_name: Name of the MCP server
variables:
  sleep_action_id: 08f58e7f-259d-4162-904a-a54546dc38fb
  text_action_id: 826e7d02-ef91-4578-8b20-72f22f9e144f
  mcp_server_name: MCP Server@latest
