openapi: 3.0.3

info:
  title: KiGa 3000 API
  version: 1.0.0
  description: |
    Read-only HTTP API over the KiGa 3000 card index.

    The application itself is a Swing desktop client, and Swing does not run on mobile.
    Any path to a phone client means the data has to be reachable over HTTP first, with
    the desktop client and the phone talking to the same service. This API is that first
    step, kept deliberately small.

    ## Deliberate limits

    - **Read-only.** No POST, PUT, PATCH or DELETE. Anything else returns `405` and
      advertises `Allow: GET`. The data is about children; a write API needs an
      authorisation model first.
    - **Loopback only.** Bound to `127.0.0.1`, never `0.0.0.0`, so it is not reachable
      from the network even by accident.
    - **No authentication yet** — which is precisely why the response projection is
      narrow. See `CardSummary`: religion, nationality, vaccination history, illnesses,
      doctor, insurer and health notes are all withheld. They are special-category
      personal data under GDPR Article 9 and must not be exposed before there is an
      authentication story.
    - **Not started by the desktop application.** The server has its own `main`, so
      running the Swing client never opens a socket.

    Every response is `application/json; charset=utf-8`. Names are German and contain
    umlauts; the serialiser escapes quotes, backslashes and control characters and emits
    everything else as UTF-8.
  license:
    name: See repository LICENSE
    url: https://github.com/jonico/kiga-3000/blob/main/LICENSE

servers:
  - url: http://127.0.0.1:8080
    description: Local loopback server (default port 8080; pass another as the first argument to KigaApiServer)

tags:
  - name: Health
    description: Service liveness.
  - name: Cards
    description: Card summaries from the Karteikarte index.

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health
      description: Returns `200` with a fixed payload whenever the server is up. Takes no parameters and never fails.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                service: kiga3000
                api: read-only
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List all card summaries
      description: |
        Returns every card summary in repository order.

        The summary intentionally omits sensitive fields such as religion, health notes,
        vaccinations, illnesses, doctor and insurer data.
      responses:
        "200":
          description: All card summaries. Empty array if the index holds no cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardSummary"
              example:
                - id: 1
                  gruppe: 1
                  vorname: Johannes
                  nachname: Nicolai
                  geburtsdatum: "16.02.1980"
                  eintritt: "01.09.1983"
                - id: 2
                  gruppe: 1
                  vorname: Jana
                  nachname: Nicolai
                  geburtsdatum: "20.11.1984"
                  eintritt: "01.09.1987"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Cards]
      operationId: rejectWrite
      summary: Writes are rejected
      description: |
        Documented because the rejection is a guaranteed part of the contract, not because
        writing is supported. The API is read-only: every non-`GET` method on any `/api`
        path returns `405` with an `Allow: GET` header. There is no request body to send.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/cards/{id}:
    get:
      tags: [Cards]
      operationId: getCardById
      summary: Get one card summary by id
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: The card summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardSummary"
              example:
                id: 2
                gruppe: 1
                vorname: Jana
                nachname: Nicolai
                geburtsdatum: "20.11.1984"
                eintritt: "01.09.1987"
        "400":
          description: The `id` path segment is not an integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 400
                error: 'Not a number: For input string: "abc"'
        "404":
          description: No card exists with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                error: No card with id 99999
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/groups/{gruppe}/cards:
    get:
      tags: [Cards]
      operationId: listCardsByGroup
      summary: List card summaries in one group
      parameters:
        - $ref: "#/components/parameters/Gruppe"
      responses:
        "200":
          description: Card summaries in the group. Empty array if the group exists in range but holds no cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardSummary"
              example:
                - id: 5
                  gruppe: 2
                  vorname: Nigel
                  nachname: Abbott
                  geburtsdatum: "17.03.1981"
                  eintritt: "01.09.1984"
        "400":
          description: The `gruppe` path segment is not an integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 400
                error: 'Not a number: For input string: "abc"'
        "404":
          description: The group number is outside the supported range `0..255`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                error: "No such group: 300"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    CardId:
      name: id
      in: path
      required: true
      description: Card id. Must be an integer; a non-numeric value returns `400`, an unknown one `404`.
      schema:
        type: integer
        format: int32
      example: 2

    Gruppe:
      name: gruppe
      in: path
      required: true
      description: |
        Group number. Must be an integer in `0..255` — the backend stores the group as a
        byte. A non-numeric value returns `400`; a numeric value outside the range
        returns `404`.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 255
      example: 2

  schemas:
    CardSummary:
      type: object
      title: Card summary
      description: |
        The narrow projection the API exposes for a card. The underlying table has 39
        columns; the six below are the ones a Kindergarten group list would print on paper
        anyway. Everything else — religion, nationality, vaccination history, illnesses,
        doctor, health insurer, free-text health notes — is withheld.
      required: [id, gruppe, vorname, nachname, geburtsdatum, eintritt]
      properties:
        id:
          type: integer
          format: int32
          description: Card id, unique within the index.
          example: 2
        gruppe:
          type: integer
          format: int32
          minimum: 0
          maximum: 255
          description: Group number the child belongs to.
          example: 1
        vorname:
          type: string
          nullable: true
          description: First name. May contain German umlauts. `null` if unset in the index.
          example: Jana
        nachname:
          type: string
          nullable: true
          description: Last name. May contain German umlauts. `null` if unset in the index.
          example: Nicolai
        geburtsdatum:
          type: string
          nullable: true
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          description: |
            Date of birth as German-formatted text, `dd.MM.yyyy`. Deliberately not an
            ISO `date`: the backend passes the stored string through unparsed.
          example: "20.11.1984"
        eintritt:
          type: string
          nullable: true
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          description: Date of entry into the Kindergarten, German-formatted text, `dd.MM.yyyy`.
          example: "01.09.1987"

    Health:
      type: object
      title: Health status
      description: Fixed liveness payload. All three fields are constants in the current build.
      required: [status, service, api]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok` — the endpoint returns `200` or nothing at all.
        service:
          type: string
          enum: [kiga3000]
        api:
          type: string
          enum: [read-only]

    Error:
      type: object
      title: Error
      description: Uniform error body used by every non-`2xx` response.
      required: [status, error]
      properties:
        status:
          type: integer
          format: int32
          description: Repeats the HTTP status code.
          example: 404
        error:
          type: string
          description: Human-readable message. Never contains a stack trace.
          example: No card with id 99999

  responses:
    InternalServerError:
      description: |
        An unexpected failure inside a handler. The router catches every `RuntimeException`
        and returns this rather than letting a stack trace reach the client, so the body is
        always the generic message below.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 500
            error: Internal error

    MethodNotAllowed:
      description: |
        The API is read-only. Returned for every non-`GET` method on any `/api` path.
      headers:
        Allow:
          description: Methods the endpoint accepts. Always `GET`.
          schema:
            type: string
            enum: [GET]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 405
            error: This API is read-only
